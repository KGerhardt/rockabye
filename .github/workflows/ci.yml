name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install rockabye
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyflakes

      - name: Lint
        run: python -m pyflakes rockabye/*.py tests/*.py

      - name: Unit tests
        run: python tests/test_units.py

      - name: CLI smoke test
        run: |
          rockabye --version
          rockabye build --help > /dev/null
          rockabye validate --help > /dev/null

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installed exactly the way the README tells users to, so CI also checks
      # that those instructions still work. Debian's bbmap package does not ship
      # randomreads.sh, which rockabye requires.
      - name: Install external tools from bioconda
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: rockabye-ci
          create-args: >-
            python=3.12
            diamond
            bbmap
            muscle
            pandas
          condarc: |
            channels:
              - conda-forge
              - bioconda

      - name: Install rockabye
        shell: bash -el {0}
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          diamond version
          randomreads.sh --version 2>&1 | head -2 || true

      - name: Build a model from synthetic data and validate it
        shell: bash -el {0}
        run: |
          python tests/make_test_data.py /tmp/td
          rockabye build -p /tmp/td/positives -n /tmp/td/negatives -o /tmp/proj -t 2
          rockabye validate /tmp/proj

      - name: Load the model with ROCkOut's own filter
        shell: bash -el {0}
        run: |
          git clone --depth 1 https://github.com/KGerhardt/ROCkOut.git /tmp/ROCkOut
          python tests/test_rockout_interop.py \
            /tmp/ROCkOut/modules/rocker_filter.py \
            /tmp/proj "$(command -v diamond)" \
            /tmp/td/positives /tmp/td/negatives /tmp/interop

      - name: Refuse to overwrite an existing model
        shell: bash -el {0}
        run: |
          if rockabye build -p /tmp/td/positives -n /tmp/td/negatives -o /tmp/proj -q; then
            echo "expected a refusal to overwrite"; exit 1
          fi
          rockabye build -p /tmp/td/positives -n /tmp/td/negatives -o /tmp/proj -q --force
