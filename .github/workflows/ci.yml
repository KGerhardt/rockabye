name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install rockabye
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyflakes

      - name: Lint
        run: python -m pyflakes rockabye/*.py tests/*.py

      - name: Unit tests
        run: python tests/test_units.py

      - name: CLI smoke test
        run: |
          rockabye --version
          rockabye build --help > /dev/null
          rockabye validate --help > /dev/null

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install external tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq diamond-aligner bbmap muscle
          # Debian ships DIAMOND as `diamond-aligner`; rockabye looks for `diamond`.
          mkdir -p "$HOME/bin"
          ln -sf "$(command -v diamond-aligner)" "$HOME/bin/diamond"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install rockabye
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build a model from synthetic data and validate it
        run: |
          python tests/make_test_data.py /tmp/td
          rockabye build -p /tmp/td/positives -n /tmp/td/negatives -o /tmp/proj -t 2
          rockabye validate /tmp/proj

      - name: Load the model with ROCkOut's own filter
        run: |
          git clone --depth 1 https://github.com/KGerhardt/ROCkOut.git /tmp/ROCkOut
          pip install pandas
          python tests/test_rockout_interop.py \
            /tmp/ROCkOut/modules/rocker_filter.py \
            /tmp/proj "$(command -v diamond)" \
            /tmp/td/positives /tmp/td/negatives /tmp/interop

      - name: Refuse to overwrite an existing model
        run: |
          if rockabye build -p /tmp/td/positives -n /tmp/td/negatives -o /tmp/proj -q; then
            echo "expected a refusal to overwrite"; exit 1
          fi
          rockabye build -p /tmp/td/positives -n /tmp/td/negatives -o /tmp/proj -q --force
