[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rockabye"
version = "0.1.0"
description = "Build ROCkOut-compatible read filtering models from labelled positive, negative, and genome inputs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kenji Gerhardt", email = "kenji.gerhardt@gmail.com" }]
keywords = ["metagenomics", "bioinformatics", "ROCker", "ROCkOut", "read-filtering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = ["numpy>=1.22"]

[project.urls]
Homepage = "https://github.com/KGerhardt/rockabye"
Repository = "https://github.com/KGerhardt/rockabye"
Issues = "https://github.com/KGerhardt/rockabye/issues"

[project.scripts]
rockabye = "rockabye.cli:main"

[tool.setuptools.packages.find]
include = ["rockabye*"]
